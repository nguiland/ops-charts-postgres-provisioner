replicaCount: 1

image:
  repository: host.docker.internal:80/docker-local/ops/apps/postgres-provisioner
  pullPolicy: IfNotPresent
  tag: 0.1.0

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

ports:
  - name: metrics
    containerPort: 8080
    protocol: TCP
  - name: health
    containerPort: 8081
    protocol: TCP

livenessProbe:
  httpGet:
    path: /healthz
    port: health

readinessProbe:
  httpGet:
    path: /readyz
    port: health

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

envMap: {}

env: 
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace

leaderElection: true
